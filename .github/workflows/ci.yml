name: JAHID.AI CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-memory.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-memory.txt

      - name: Compile Python sources
        run: python -m compileall -q backend tests scripts

      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -p 'test_*.py' -v

      - name: Run root tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run repository doctor
        run: python scripts/jahid_doctor.py
