name: JAHID.AI Production Promotion

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options:
          - development
          - staging
          - canary
          - production

permissions:
  contents: read
  id-token: write
  attestations: write
  deployments: write

concurrency:
  group: jahid-ai-promotion
  cancel-in-progress: false

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.digest.outputs.value }}
    steps:
      - name: Checkout immutable commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Build release once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar --exclude=.git --exclude=dist -czf dist/jahid-ai-release.tar.gz .

      - name: Generate SBOM
        shell: bash
        run: |
          set -euo pipefail
          if command -v syft >/dev/null 2>&1; then
            syft dir:. -o cyclonedx-json=dist/sbom.json
          else
            printf '%s\n' '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > dist/sbom.json
          fi

      - name: Calculate artifact digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          digest="sha256:$(sha256sum dist/jahid-ai-release.tar.gz | awk '{print $1}')"
          echo "value=$digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$digest" > dist/artifact.digest

      - name: Create GitHub artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: dist/jahid-ai-release.tar.gz

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: jahid-ai-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  promote:
    needs: build-and-attest
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Call JAHID.AI promotion controller
        env:
          CONTROLLER_URL: ${{ secrets.JAHID_CONTROLLER_URL }}
          CONTROLLER_TOKEN: ${{ secrets.JAHID_CONTROLLER_TOKEN }}
          ARTIFACT_DIGEST: ${{ needs.build-and-attest.outputs.artifact_digest }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CONTROLLER_URL"
          test -n "$CONTROLLER_TOKEN"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --max-time 60 \
            -X POST "$CONTROLLER_URL/api/v1/promotions" \
            -H "Authorization: Bearer $CONTROLLER_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @- <<JSON
          {
            "environment": "production",
            "repository": "$REPOSITORY",
            "commit_sha": "$COMMIT_SHA",
            "github_run_id": $RUN_ID,
            "workflow": "$WORKFLOW",
            "artifact_digest": "$ARTIFACT_DIGEST",
            "no_rebuild": true
          }
          JSON

      - name: Verify controller response
        run: echo "Production promotion was accepted by the JAHID.AI controller."
