name: Autonomous Maintenance

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-memory.txt

      - name: Compile sources
        run: python -m compileall -q backend tests scripts

      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -p 'test_*.py' -v

      - name: Run root tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run repository doctor
        run: python scripts/jahid_doctor.py

      - name: Open maintenance issue on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Automated maintenance failure: ${{ github.run_id }}" \
            --body "The scheduled JAHID.AI maintenance diagnostics failed.\n\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nThe GitHub agent should inspect the failing step, reproduce the issue, prepare a branch, and open a draft PR. Do not merge automatically." \
            --label "maintenance"
