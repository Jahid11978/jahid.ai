name: Memory Fabric

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-fabric-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory-tests:
    name: Memory Fabric Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install memory dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r backend/requirements-memory.txt

      - name: Run memory tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s backend/tests -p 'test_*.py'
